<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>결제 실패 - 토스 쇼핑몰</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .result-box { max-width: 480px; margin: 4rem auto; padding: 2rem; background: #fff; border-radius: 12px; text-align: center; }
    .result-box a { display: inline-block; margin-top: 1rem; color: #0064ff; }
  </style>
</head>
<body>
  <div class="result-box" id="result-box">
    <h1>결제에 실패했습니다</h1>
    <p id="error-message"></p>
    <a href="/">홈으로 돌아가기</a>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");
    const message = params.get("message");
    document.getElementById("error-message").textContent =
      message ? `${message} (${code})` : "알 수 없는 오류가 발생했습니다.";
  </script>
</body>
</html>
